# REFERENCE ONLY - NOT the server file.
#
# The authoritative compose file is /opt/askdiq/docker-compose.prod.yml on
# Internal-Dev-Ubuntu. Never copy this file over it. Diff the two and add only
# what is missing (for this release: the `askdiq-web` service block). The
# deploy kit ships this file under deploy-kit/, never into /opt/askdiq.
#
# Networks (both EXTERNAL, created and owned outside this project):
#   askdiq_internal       shared with the reverse proxy et-platform-nginx-1;
#                         nginx reaches askdiq-api:8000 and askdiq-web:3000
#                         by container name.
#   et-platform_internal  where et-platform-postgres-1 (the DB) lives; only
#                         the backend containers join it.
#
# Host ports: the web service publishes NONE. Ports 3001-3600, 5000-5600 and
# 5501 on the host belong to other apps. If a debug port is ever needed, bind
# 127.0.0.1 only; 127.0.0.1:5500 is the one known-free choice (one service
# at a time). See docs/deployment/runbook.md, "Port plan".
#
# Usage on the server (from /opt/askdiq, with the server's own file):
#   docker compose -f docker-compose.prod.yml build askdiq-api askdiq-web
#   docker compose -f docker-compose.prod.yml up -d --force-recreate askdiq-api askdiq-web

services:
  askdiq-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: askdiq-api:latest
    container_name: askdiq-api
    env_file:
      - ./backend/.env
    environment:
      # Start-up automation (backend/docker-entrypoint.sh). Only this one
      # service runs it; the worker below never does.
      RUN_MIGRATIONS: "true"
      RUN_INGESTION: "true"
      # Set to "true" for ONE deploy to run the usage-accounting backfill,
      # then back to "false".
      RUN_USAGE_BACKFILL: "false"
    restart: unless-stopped
    # Keep whatever exposure the server file already has. Debug-only option:
    # ports:
    #   - "127.0.0.1:5500:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      # Migrations + ingestion run before uvicorn starts.
      start_period: 180s
      retries: 3
    stop_grace_period: 30s
    networks:
      - askdiq_internal
      - et-platform_internal

  askdiq-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      # NEXT_PUBLIC_* values would go here (baked at build). None are used today.
      # args:
      #   NEXT_PUBLIC_EXAMPLE: "value"
    image: askdiq-web:latest
    container_name: askdiq-web
    # Server-only runtime settings: API_BASE_URL=http://askdiq-api:8000,
    # API_KEY, APP_BASE_URL, SESSION_COOKIE_*, ACCESS_CONTACT_EMAIL.
    env_file:
      - ./frontend/.env
    restart: unless-stopped
    depends_on:
      askdiq-api:
        condition: service_started
    # NO ports: reached only through et-platform-nginx-1 on askdiq_internal.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - askdiq_internal

  # Optional dedicated job worker (python -m app.jobs.worker). Off by default:
  # with JOBS_WORKER_ENABLED unset (default true) the API runs jobs in-process.
  # To use it: `docker compose --profile worker up -d askdiq-worker` AND set
  # JOBS_WORKER_ENABLED=false on askdiq-api. The entrypoint never migrates or
  # ingests for this command; the RUN_* flags below make that explicit.
  askdiq-worker:
    image: askdiq-api:latest
    container_name: askdiq-worker
    profiles: ["worker"]
    command: ["python", "-m", "app.jobs.worker"]
    env_file:
      - ./backend/.env
    environment:
      RUN_MIGRATIONS: "false"
      RUN_INGESTION: "false"
      RUN_USAGE_BACKFILL: "false"
    restart: unless-stopped
    depends_on:
      askdiq-api:
        condition: service_healthy
    # No HTTP server, so the image's /health HEALTHCHECK does not apply.
    healthcheck:
      disable: true
    stop_grace_period: 45s
    networks:
      - et-platform_internal

networks:
  askdiq_internal:
    external: true
    name: askdiq_internal
  et-platform_internal:
    external: true
    name: et-platform_internal
