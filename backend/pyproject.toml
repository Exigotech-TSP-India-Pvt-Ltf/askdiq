[project]
name = "askdiq-backend"
version = "0.1.0"
description = "AskDIQ RAG backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",    # line too long (managed by ruff format)
    "B008",    # do not perform function call `Depends` in argument defaults (standard FastAPI pattern)
    "B905",    # zip() without an explicit strict= parameter
    "RUF001",  # ambiguous unicode character (intentional quotes / dashes in domain strings and tests)
    "RUF002",  # ambiguous unicode character in docstrings
    "RUF003",  # ambiguous unicode character in comments
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
