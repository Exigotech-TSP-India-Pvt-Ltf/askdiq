# Place this file at the nginx config mount path found via:
#   docker inspect et-platform-nginx-1 --format '{{range .Mounts}}{{.Destination}}{{println}}{{end}}'
# Adjust the ssl_certificate paths / any shared "include" snippets to match
# an existing .conf in that directory (e.g. ssl params, security headers).

# --- Load balancing (planchanges4 B1.6.1, newplan section 13.2) ---
# Two API replicas (docker-compose.prod.yml: api-1, api-2), each running
# WEB_CONCURRENCY uvicorn workers. Shared state lives in Postgres, so no
# sticky sessions. A replica that fails 3 times is skipped for 10 s.
upstream askdiq_api {
    least_conn;
    server askdiq-api-1:8000 max_fails=3 fail_timeout=10s;
    server askdiq-api-2:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Keep upstream connections alive ("") unless the client asks for a
# WebSocket upgrade. Prefixed name avoids clashing with other site confs.
map $http_upgrade $askdiq_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name askdiq.ethub.co;

    # Redirect to HTTPS — remove this block if this host terminates TLS elsewhere.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name askdiq.ethub.co;

    # Replace with the actual cert paths used by your other site confs.
    ssl_certificate     /etc/letsencrypt/live/askdiq.ethub.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/askdiq.ethub.co/privkey.pem;

    # If other confs `include` a shared ssl params / security headers snippet,
    # add the same include(s) here, e.g.:
    # include /etc/nginx/snippets/ssl-params.conf;

    # --- Security hardening (planchanges4 B1.1.3, newplan section 12.2) ---
    # Do not advertise the nginx version.
    server_tokens off;
    # Matches the Next.js proxy body cap (15 MB).
    client_max_body_size 15m;

    # `always` sends the headers on error responses (4xx/5xx) too. Any
    # add_header inside a location block would replace these, so keep
    # them at server level only. proxy_hide_header stops a duplicate when the
    # upstream (FastAPI SecurityHeadersMiddleware) sets the same header.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Powered-By;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Server-Sent Events (e.g. /governance/stream): stream each event as
    # it is written and allow long-lived connections (the API sends a
    # keepalive comment every SSE_HEARTBEAT_SECONDS).
    location ~ ^/(.+/)?(stream|events)$ {
        proxy_pass http://askdiq_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location / {
        proxy_pass http://askdiq_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upstream keepalive, with WebSocket upgrade when requested.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $askdiq_connection_upgrade;

        proxy_read_timeout 60s;

        # Fail over to the other replica on connection errors, timeouts and
        # 502/503. nginx never retries a non-idempotent request (POST, PATCH)
        # once it has been sent upstream.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
