name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/ci
      AZURE_OPENAI_API_KEY: ci-test-key
      AZURE_OPENAI_ENDPOINT: https://ci-test-resource.openai.azure.com/
      AZURE_OPENAI_API_VERSION: 2024-12-01-preview
      AZURE_DEPLOYMENT_NAME: gpt-5-mini
      EMBEDDING_MODEL: text-embedding-3-small
      API_JWT_SECRET: ci-only-test-secret-not-for-production
      API_KEY_NAME: ci-test-key
      ENV: development
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Lint and format check (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Security scan (bandit)
        run: bandit -r app -ll
      - name: Run database migrations
        run: alembic upgrade head
      - name: Run backend tests with coverage
        run: python -m pytest --cov=app

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: TypeScript type-check
        run: npx tsc --noEmit
      - name: Build frontend
        run: npm run build
