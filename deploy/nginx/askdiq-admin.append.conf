# ==== AskDIQ admin dashboard (askdiq-web) =====================================
# Append to the EXISTING askdiq nginx conf of et-platform-nginx-1 (do not add a
# new file). Replace <DASHBOARD_DOMAIN> everywhere, e.g.:
#   sed "s#<DASHBOARD_DOMAIN>#askdiq-admin.ethub.co#g" askdiq-admin.append.conf
# Order (see deploy/DEPLOYMENT_GUIDE.md section 1):
#   1. append PART 1 only, nginx -t, reload
#   2. certbot certonly --webroot ... --register-unsafely-without-email
#   3. append PART 2, nginx -t, reload
# The ACME webroot below must equal the one the existing askdiq.ethub.co block
# uses; change /var/www/certbot if it differs.
# Next.js sets its own CSP/HSTS/frame headers: do not add security headers here.

# === PART 1 (HTTP) ===
server {
    listen 80;
    server_name <DASHBOARD_DOMAIN>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# === PART 2 (HTTPS, after the certificate exists) ===
server {
    listen 443 ssl;
    server_name <DASHBOARD_DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<DASHBOARD_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DASHBOARD_DOMAIN>/privkey.pem;

    server_tokens off;
    # Matches the Next.js proxy body cap (15 MB, document uploads).
    client_max_body_size 15m;

    # Resolve per request through Docker DNS so nginx -t / reload never fail
    # while askdiq-web is stopped (that would block reloads for every app).
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $askdiq_web http://askdiq-web:3000;

    # REQUIRED: Next middleware builds redirects from its own listen address
    # (http://localhost:3000/...); rewrite them to the public origin.
    proxy_redirect ~^https?://(?:localhost|127\.0\.0\.1|0\.0\.0\.0|askdiq-web)(?::[0-9]+)?(/.*)?$ https://$host$1;

    # Live governance feed (Server-Sent Events): no buffering, long-lived.
    location = /api/proxy/admin/governance/stream {
        proxy_pass $askdiq_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass $askdiq_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Set, not appended, so a browser cannot spoof the client IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        # Chat answers and exports can take a while.
        proxy_read_timeout 120s;
    }
}
# ==== end AskDIQ admin dashboard ==============================================
